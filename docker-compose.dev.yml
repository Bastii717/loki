services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: loki
      POSTGRES_USER: loki
      POSTGRES_DB: loki
    ports:
      - '5432:5432'

  minio:
    # minio/minio is no longer published on Docker Hub or quay.io; Chainguard ships a maintained build
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - '8080:8080'
    environment:
      SERVER_PORT: '8080'
      JSON_CONFIG: >-
        {"interactiveLogin": true, "tokenCallbacks": [{"issuerId": "loki", "requestMappings": [{"requestParam": "grant_type", "match": "*", "claims": {"groups": ["loki-members", "loki-mods", "loki-admins"], "preferred_username": "dev", "email": "dev@example.test"}}]}]}
