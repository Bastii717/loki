# Loki local development stack: Postgres, MinIO, a mock OIDC provider and a mail catcher.
# Only the backing services run here; the app itself runs on the host via `npm run dev`.
#
#   cp .env.dev.example .env
#   docker compose -f docker-compose.dev.yml up -d
#
# Not for production (fixed credentials, published ports): see docker-compose.yml.
name: loki-dev

services:
  # ── db ──────────────────────────────────────────────────────────────────────
  # PostgreSQL on localhost:5432 (user, password and database are all "loki").
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: loki
      POSTGRES_USER: loki
      POSTGRES_DB: loki
    ports:
      - '5432:5432'

  # ── minio ───────────────────────────────────────────────────────────────────
  # S3-compatible storage standing in for Cloudflare R2: API on localhost:9000, web console on
  # localhost:9001, login minioadmin / minioadmin. Needs S3_FORCE_PATH_STYLE=true.
  minio:
    # minio/minio is no longer published on Docker Hub or quay.io; Chainguard ships a maintained build
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'

  # ── oidc ────────────────────────────────────────────────────────────────────
  # Mock OAuth2/OIDC server standing in for Authentik: issuer http://localhost:8080/loki.
  # JSON_CONFIG enables the interactive login page and, for every token request (any grant type),
  # adds the claims the app needs: all three role groups (members, mods, admins), a username
  # and an email, so the dev user can use every feature.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: '8080'
      JSON_CONFIG: >-
        {"interactiveLogin": true, "tokenCallbacks": [{"issuerId": "loki", "requestMappings": [{"requestParam": "grant_type", "match": "*", "claims": {"groups": ["loki-members", "loki-mods", "loki-admins"], "preferred_username": "dev", "email": "dev@example.test"}}]}]}
    ports:
      - '8080:8080'

  # ── mailpit ─────────────────────────────────────────────────────────────────
  # Catch-all SMTP server for the feedback mails: SMTP on localhost:1025 (no auth, no TLS), web
  # inbox on http://localhost:8025. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - '1025:1025'
      - '8025:8025'
