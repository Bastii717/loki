<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="refresh" content="30" />
		<meta name="color-scheme" content="dark light" />
		<title>Loki is taking a break</title>
		<style>
			:root {
				--bg: #111214;
				--text: #f2f3f5;
				--accent: #5865f2;
			}
			@media (prefers-color-scheme: light) {
				:root {
					--bg: #f2f3f5;
					--text: #1e1f22;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 16px;
				background: var(--bg);
				color: var(--text);
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				text-align: center;
			}
			main {
				max-width: 360px;
			}
			h1 {
				display: inline-block;
				margin: 0 0 12px;
				padding-bottom: 8px;
				border-bottom: 3px solid var(--accent);
				font-size: 1.5rem;
			}
			p {
				margin: 0;
				line-height: 1.5;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Loki is taking a break</h1>
			<p>We'll be back shortly. This page retries on its own.</p>
		</main>
	</body>
</html>
