version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Berlin'
    labels:
      - 'dependencies'
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # @types/node majors must follow the Node runtime (24, pinned in
      # engines, .nvmrc, Dockerfile and CI); bump them together by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'docker'
    directories:
      - '/'
      - '/backup'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Berlin'
    labels:
      - 'dependencies'
    ignore:
      # Same rule as @types/node: the Node major is pinned project-wide.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Berlin'
    labels:
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'
