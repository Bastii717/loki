# Loki production stack: app + bundled Postgres, optional backup, Cloudflare Tunnel and MinIO.
#
#   cp .env.example .env     # fill it in
#   docker compose pull && docker compose up -d
#
# Configuration comes from ./.env. Storage is Cloudflare R2 (EU) by default; TLS terminates outside
# this stack (Cloudflare Tunnel or an external nginx). Details, operations and the optional
# services below: docs/deployment.md.
name: loki

services:
  # ── app ─────────────────────────────────────────────────────────────────────
  # The Loki web app (image built by CI). Always on. Waits for a healthy database.
  app:
    image: ghcr.io/bastii717/loki:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # adapter-node rejects larger request bodies (default 512K); keep >= MAX_UPLOAD_MB
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-60M}
      # overrides any DATABASE_URL in .env so the app always talks to the bundled db
      DATABASE_URL: postgres://loki:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/loki
    # nginx path: publish on loopback only; not needed with the cloudflared sidecar
    ports:
      - '127.0.0.1:3000:3000'

  # ── db ──────────────────────────────────────────────────────────────────────
  # Bundled PostgreSQL. Always on. Data lives in the `db-data` volume.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: loki
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loki -d loki']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── backup (optional) ───────────────────────────────────────────────────────
  # Encrypted nightly backups (Postgres dump + media bucket) to a separate S3 bucket.
  # Commented out by default because it needs ./backup.env (copy backup.env.example).
  # It deliberately uses its OWN env file: the app must never see the backup credentials or
  # crypt keys, and the backup job must not see the app's secrets (OIDC client secret etc.).
  # See docs/deployment.md and backup/README.md (also: restore runbook).
  # backup:
  #   build: ./backup
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   env_file: backup.env
  #   environment:
  #     BACKUP_DATABASE_URL: postgres://loki:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/loki

  # ── cloudflared (optional) ──────────────────────────────────────────────────
  # Cloudflare Tunnel sidecar (alternative to nginx). Set TUNNEL_TOKEN in .env, point the
  # tunnel's public hostname at http://app:3000, and drop the `ports:` entry of `app`.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   depends_on:
  #     - app
  #   environment:
  #     TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}

  # ── minio (optional, self-host fallback) ────────────────────────────────────
  # Use instead of Cloudflare R2 (the primary storage). Uncomment this service and its volume below,
  # and replace the R2 values in .env:
  #   S3_ENDPOINT=http://minio:9000  S3_FORCE_PATH_STYLE=true  S3_REGION=us-east-1
  #   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY = MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
  # Create the bucket once (e.g. with `mc mb`) and keep it private.
  # minio:
  #   image: cgr.dev/chainguard/minio:latest
  #   restart: unless-stopped
  #   command: server /data
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  #   volumes:
  #     - minio-data:/data

volumes:
  db-data:
  # minio-data:
